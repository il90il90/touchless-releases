# OPTIONAL: public HTTPS for cloud AIs (ChatGPT / Claude on the web).
# Needs a real domain (RELAY_DOMAIN) pointing at this computer, ports 80/443 open, and ACME_EMAIL.
# Caddy gets and renews a Let's Encrypt certificate and proxies HTTPS/WSS to the relay.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# For your own devices only, a VPN (Tailscale / WireGuard) is simpler than opening ports.
services:
  relay:
    environment:
      TRUST_PROXY: "1" # behind Caddy: read the real client IP from X-Forwarded-For

  caddy:
    image: caddy:2
    container_name: touchless-caddy
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
